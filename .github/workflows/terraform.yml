name: Terraform CI/CD

# -------------------------------
# Triggers
# -------------------------------
on:
  push:
    branches:
      - main # Only apply infra on main
  pull_request:
    branches:
      - develop # Plan on PRs from feature branches
  workflow_dispatch:

# -------------------------------
# Jobs
# -------------------------------
jobs:
  terraform:
    name: Terraform Workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      # Use managed identity
      ARM_USE_MSI: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_UAMI_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_uami_client_id: ${{ secrets.ARM_UAMI_CLIENT_ID }}

    steps:
      # 1. Checkout the repository to the GitHub Actions runner
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Verify Azure secrets are set
      # - name: Verify Azure secrets
      #   run: |
      #     if [[ -z "$ARM_CLIENT_ID" || -z "$ARM_SUBSCRIPTION_ID" || -z "$ARM_TENANT_ID" ]]; then
      #       echo "Missing required Azure secrets."
      #       exit 1
      #     fi

      - name: Debug Azure Secret Lengths
        run: |
          echo "Client ID length: ${#ARM_CLIENT_ID}"
          echo "Subscription ID length: ${#ARM_SUBSCRIPTION_ID}"
          echo "Tenant ID length: ${#ARM_TENANT_ID}"

      # 3. Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # 4. Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: terraform -chdir=infra/terraform/envs/dev init

      # 5. Checks that all Terraform configuration files adhere to a canonical format
      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform/envs/dev fmt -check

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/envs/dev validate

      # 7. Generates an execution plan for Terraform
      - name: Terraform Plan
        id: plan
        run: terraform -chdir=infra/terraform/envs/dev plan -out=tfplan

      #8.  On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud".
      # See the documentation on "strict" required status checks for more information:
      # https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan #gating condition to apply changes only when main is updated
